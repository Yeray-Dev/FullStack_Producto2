<!DOCTYPE html>
<!--
	Prompts (IA: Claude, Anthropic)
	1. "¿Cómo hago que la tabla se vea bien en móvil sin que se rompa el diseño?"
	2. "¿Cómo distingo visualmente una oferta de una petición en la tabla?"
	3. "¿Qué componentes de Bootstrap conviene usar para el formulario y por qué?"
	4. "¿Por qué uso `textContent` y no `innerHTML` al pintar la tabla?"
-->
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Intercambios · Tándem</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap"
		rel="stylesheet">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

	<link href="../css/base.css" rel="stylesheet">
	<link href="../css/dashboard.css" rel="stylesheet">
	<link href="../css/intercambios.css" rel="stylesheet">

	<script type="module" src="../js/intercambios.js"></script>
</head>

<body>
	<header class="navbar navbar-expand-lg sticky-top bg-white border-bottom">
		<div class="container-fluid px-4">
			<a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
				<img src="../media/logo.svg" alt="" width="28" height="28">
				Tándem
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
				aria-controls="mainMenu" aria-expanded="false" aria-label="Abrir menu">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div id="mainMenu" class="collapse navbar-collapse">
				<nav class="ms-lg-5">
					<ul class="navbar-nav gap-lg-3">
						<li class="nav-item"><a class="nav-link" href="dashboard.html">
								<i class="bi bi-grid-1x2" aria-hidden="true"></i>
								Tablón
							</a></li>
						<li class="nav-item"><a class="nav-link active" href="intercambios.html" aria-current="page">
								<i class="bi bi-arrow-left-right" aria-hidden="true"></i>
								Intercambios
							</a></li>
						<li class="nav-item"><a class="nav-link" href="usuarios.html">
								<i class="bi bi-people" aria-hidden="true"></i>
								Usuarios
							</a></li>
					</ul>
				</nav>
				<span class="d-flex border rounded-5 shadow-sm p-2">
					<span id="usuarioActivo" class="p-1 small">-no login-</span>
				</span>
				</span>
				<a href="./login.html" class="btn btn-logout">
					<i class="bi bi-box-arrow-right" aria-hidden="true"></i>
					Salir
				</a>
			</div>

		</div>
		</div>
	</header>

	<main class="px-4 pt-4 pb-5">
		<header class="mb-4">
			<h1 class="fs-2 mb-2">Intercambios</h1>
			<p class="text-body-secondary small mb-0">Publica una oferta o una petición y gestiona las que ya tienes.
			</p>
		</header>

		<div id="mensaje-error" class="alert alert-danger d-none"></div>

		<section class="card bg-white p-4 mb-4">
			<h2 class="fs-5 mb-3">Nuevo intercambio</h2>

			<form id="exchange-form">
				<div class="mb-3">
					<label for="titulo" class="form-label">Título</label>
					<input type="text" id="titulo" class="form-control" required>
				</div>

				<div class="mb-3">
					<label for="email" class="form-label">Email</label>
					<input type="text" id="email" class="form-control" required>
				</div>

				<div class="mb-3">
					<label for="fecha" class="form-label">Fecha</label>
					<input type="date" id="fecha" class="form-control" required>
				</div>

				<div class="mb-3">
					<label for="descripcion" class="form-label">Descripción</label>
					<textarea id="descripcion" class="form-control" rows="3" required></textarea>
				</div>

				<div class="mb-4">
					<label for="tipo" class="form-label">Tipo</label>
					<select id="tipo" class="form-select" required>
						<option value="">Elige</option>
						<option value="offer">Ofrezco idioma</option>
						<option value="request">Busco idioma</option>
					</select>
				</div>

				<button type="submit" class="btn btn-dark w-100 py-2">Publicar</button>
			</form>
		</section>

		<section class="card bg-white mb-4">
			<h2 class="fs-5 p-4 mb-0">Intercambios publicados</h2>
			<div class="table-responsive">
				<table class="table align-middle mb-0 exchanges-table">
					<thead>
						<tr>
							<th>Título</th>
							<th>Email</th>
							<th>Fecha</th>
							<th>Descripción</th>
							<th>Tipo</th>
							<th>Acciones</th>
						</tr>
					</thead>
					<tbody id="exchange-table"></tbody>
				</table>
			</div>
		</section>

		<section class="card bg-white p-4">
			<h2 class="fs-5 mb-3">Gráfico de intercambios</h2>
			<div id="zona-grafico">
			<canvas id="grafico" class="d-block"></canvas>
</div>
		</section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
		crossorigin="anonymous"></script>
</body>

</html>
